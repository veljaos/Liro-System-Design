packages:
  - 'packages/*'
  - 'apps/*'

# Jedno mesto za verzije koje se ponavljaju u vise od tri manifesta.
#
# Ovde ulaze SAMO one koje svuda imaju istu vrednost. `react`, `next`,
# `lucide-react`, `@xyflow/react` i `@tanstack/react-query` namerno NISU tu:
# oni imaju dva razlicita opsega - siroki u `peerDependencies` (da aplikacija
# ima slobodu) i uzi u `devDependencies`. Jedan katalog unos bi ta dva spojio i
# time ili suzio peer opseg, ili prosirio dev opseg.
catalog:
  '@mantine/carousel': ^9.4.0
  '@mantine/charts': ^9.4.0
  '@mantine/code-highlight': ^9.4.0
  '@mantine/core': ^9.4.0
  '@mantine/dates': ^9.4.0
  '@mantine/dropzone': ^9.4.0
  '@mantine/hooks': ^9.4.0
  '@mantine/modals': ^9.4.0
  '@mantine/notifications': ^9.4.0
  '@mantine/nprogress': ^9.4.0
  '@mantine/schedule': ^9.4.0
  '@mantine/spotlight': ^9.4.0
  '@mantine/tiptap': ^9.4.0
  '@types/react': ^19.2.7
  typescript: ^5.9.3
  vitest: ^3.2.0

allowBuilds:
  esbuild: true
  sharp: true